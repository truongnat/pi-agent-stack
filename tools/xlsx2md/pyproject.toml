[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsx2md"
version = "0.2.0"
description = "Preprocess messy Excel, then convert with markitdown to readable Markdown tables."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "markitdown[xlsx]>=0.1.3",
  "openpyxl>=3.1",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xlsx2md = "xlsx2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
