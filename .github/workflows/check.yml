name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh
      - name: Node syntax
        run: node --check scripts/sync-settings.mjs

  rust-core:
    name: Rust Core Engine (pi-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pi-core
      - name: Check Rust Formatting
        run: cargo fmt --manifest-path crates/pi-core/Cargo.toml --check
      - name: Test Rust Core
        run: cargo test --manifest-path crates/pi-core/Cargo.toml
      - name: Build Release dylib
        run: cargo build --release --manifest-path crates/pi-core/Cargo.toml

  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/pi-native-bridge
          - packages/pi-jev-harness
          - packages/pi-subscription-providers
          - packages/pi-rl-engine
          - packages/pi-goal
          - packages/pi-orchestrator
          - packages/pi-stitch
          - packages/pi-dcp
          - packages/pi-persona
          - packages/pi-xlsx2md
          - packages/pi-gdrive
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pi-core
      - name: Build Rust Core (for native FFI)
        run: cargo build --release --manifest-path crates/pi-core/Cargo.toml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run package checks
        run: bun run check
        working-directory: ${{ matrix.package }}
