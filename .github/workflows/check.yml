name: check

on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/pi-jev-harness
          - packages/pi-subscription-providers
          - packages/pi-rl-engine
          - packages/pi-goal
          - packages/pi-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run check
        working-directory: ${{ matrix.package }}

