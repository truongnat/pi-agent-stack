[package]
name = "pi-core"
version = "0.1.0"
edition = "2021"
description = "High-performance native Rust core engine for Pi Agent Stack"
authors = ["Truong DQ <truongdq.dev@gmail.com>"]
license = "MIT"

[lib]
name = "pi_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
twox-hash = "1.6"
tiktoken-rs = "0.6"
ignore = "0.4"
rayon = "1.10"
memchr = "2.7"
tree-sitter = "0.22"
tree-sitter-typescript = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"


[dev-dependencies]
tempfile = "3.10"

