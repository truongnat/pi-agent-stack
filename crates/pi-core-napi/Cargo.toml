[package]
name = "pi-core-napi"
version = "0.5.0"
edition = "2021"
description = "Node-API addon exposing pi-core to Pi (Node) and Bun"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pi-core = { path = "../pi-core" }
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3"
serde = "1.0"
serde_json = "1.0"

[build-dependencies]
napi-build = "2"
